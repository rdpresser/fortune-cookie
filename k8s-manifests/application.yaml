apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fortune-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/rdpresser/fortune-cookie.git"
    targetRevision: feature/docker-compose-fix
    path: k8s-manifests/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
