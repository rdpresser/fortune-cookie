apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortune-backend
  namespace: default
  labels:
    app.kubernetes.io/name: fortune-backend
    app.kubernetes.io/instance: fortune-cookie
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fortune-cookie
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: fortune-cookie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortune-backend
        app.kubernetes.io/instance: fortune-cookie
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: fortune-cookie
        app.kubernetes.io/version: "1.0"
    spec:
      volumes:
        - name: logs
          emptyDir: {}
      containers:
        - name: fortune-backend
          image: localhost:5000/fortune-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: API_URL
              value: "https://api.adviceslip.com/advice"
          volumeMounts:
            - name: logs
              mountPath: /var/log/fortune_backend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /fortune
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /fortune
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false