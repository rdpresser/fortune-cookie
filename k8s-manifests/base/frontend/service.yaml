apiVersion: v1
kind: Service
metadata:
  name: fortune-frontend
  namespace: default
  labels:
    app.kubernetes.io/name: fortune-frontend
    app.kubernetes.io/instance: fortune-cookie
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: fortune-cookie
spec:
  selector:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: fortune-cookie
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP