apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fortune-frontend-hpa
  namespace: default
  labels:
    app.kubernetes.io/name: fortune-frontend
    app.kubernetes.io/instance: fortune-cookie
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: fortune-cookie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fortune-frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70